global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: stayease

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # StayEase API (running on host via `make server`)
  - job_name: stayease-api
    static_configs:
      - targets: [host.docker.internal:8080]
    metrics_path: /metrics
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Alertmanager
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
