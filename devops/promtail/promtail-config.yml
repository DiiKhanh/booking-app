server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # Collect all Docker container logs via Docker socket.
  # Only collects containers from the stayease project (label filter below).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=stayease-dev"]

    relabel_configs:
      # Strip the leading slash from container names (/booking-api → booking-api)
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

      # Expose the Compose service name as a label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

    pipeline_stages:
      # Parse Zap JSON logs from the Go API (stdout JSON)
      - match:
          selector: '{container="booking-api"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  path: path
            - labels:
                level:
            # Drop noisy health check logs
            - drop:
                source: path
                expression: ".*/(live|ready|startup).*"

      # Add a level label from JSON for any other container that emits JSON with a "level" key
      - match:
          selector: '{service=~"rabbitmq|postgres"}'
          stages:
            - static_labels:
                level: info
